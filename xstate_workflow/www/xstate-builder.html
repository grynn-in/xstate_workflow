{% extends "templates/web.html" %}

{% block title %}Workflow Builder - XState{% endblock %}

{% block head_include %}
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  /* Hide Frappe navbar for full-screen experience */
  .navbar, .web-footer, footer {
    display: none !important;
  }

  body {
    margin: 0;
    padding: 0;
    overflow: hidden;
  }

  main {
    padding: 0 !important;
    margin: 0 !important;
    max-width: none !important;
  }

  .container {
    max-width: none !important;
    padding: 0 !important;
  }

  #workflow-builder-root {
    width: 100vw;
    height: 100vh;
  }

  /* Loading state */
  .loading-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background: #0f172a;
    color: white;
  }

  .loading-spinner {
    width: 48px;
    height: 48px;
    border: 4px solid rgba(99, 102, 241, 0.3);
    border-top-color: #6366f1;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 16px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Error state */
  .error-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background: #0f172a;
    color: white;
    text-align: center;
    padding: 20px;
  }

  .error-container h2 {
    color: #ef4444;
    margin-bottom: 16px;
  }

  .error-container p {
    color: #94a3b8;
    max-width: 500px;
  }

  .error-container a {
    color: #6366f1;
    text-decoration: none;
    margin-top: 20px;
  }

  .error-container a:hover {
    text-decoration: underline;
  }
</style>
{% endblock %}

{% block page_content %}
<div id="workflow-builder-root">
  <div class="loading-container">
    <div class="loading-spinner"></div>
    <p>Loading Workflow Builder...</p>
  </div>
</div>

<script>
  // Get machine_id from URL path or query params
  (function() {
    var machineId = '';

    // Try path: /xstate-builder/machine_name
    var pathMatch = window.location.pathname.match(/\/xstate-builder\/([^\/\?]+)/);
    if (pathMatch && pathMatch[1]) {
      machineId = pathMatch[1];
    }

    // Try query param: ?machine_id=machine_name
    if (!machineId) {
      var params = new URLSearchParams(window.location.search);
      machineId = params.get('machine_id') || params.get('name') || '';
    }

    document.getElementById('workflow-builder-root').dataset.machineId = machineId;
    console.log('XState Builder: machine_id =', machineId || '(new workflow)');
  })();
</script>
{% endblock %}

{% block script %}
<script>
  // Error handler
  window.onerror = function(msg, url, lineNo, columnNo, error) {
    var root = document.getElementById('workflow-builder-root');
    if (root) {
      root.innerHTML = `
        <div class="error-container">
          <h2>⚠️ Failed to Load</h2>
          <p>The Workflow Builder could not be loaded. This might be because:</p>
          <ul style="text-align: left; color: #94a3b8;">
            <li>The JavaScript bundle hasn't been built yet</li>
            <li>There's a browser compatibility issue</li>
            <li>Network error loading resources</li>
          </ul>
          <p style="margin-top: 16px; font-size: 12px; color: #64748b;">
            Error: ${msg}
          </p>
          <a href="/app/state-machine">Go to State Machine List</a>
        </div>
      `;
    }
    return false;
  };

  // Explicit mount - bundle's auto-mount may fail due to timing
  (function tryMount() {
    if (window.XStateWorkflowBuilder && window.XStateWorkflowBuilder.mountBuilder) {
      window.XStateWorkflowBuilder.mountBuilder();
    } else {
      setTimeout(tryMount, 50);
    }
  })();
</script>
{% endblock %}
